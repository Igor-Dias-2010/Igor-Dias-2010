name: Update GitHub Stats

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Create stats card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: stats
                  options: username=Igor-Dias-2010&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true
                  path: profile/stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Create languages card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: top-langs
                  options: username=Igor-Dias-2010&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
                  path: profile/top-langs.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Create Vexly card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Igor-Dias-2010&repo=vexly&theme=tokyonight&hide_border=true
                  path: profile/vexly.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Create Portfolio card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Igor-Dias-2010&repo=portfolio&theme=tokyonight&hide_border=true
                  path: profile/portfolio.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Create BSBET card
              uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Igor-Dias-2010&repo=bsbet&theme=tokyonight&hide_border=true
                  path: profile/bsbet.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit generated cards
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add profile/*.svg
                  git commit -m "Update GitHub stats cards" || exit 0
                  git push
