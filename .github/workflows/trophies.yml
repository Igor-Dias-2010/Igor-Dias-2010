name: Update GitHub Trophies

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Generate trophies
              uses: soulteary/github-profile-trophy-action@v1
              with:
                  options: "username=Igor-Dias-2010&theme=tokyonight&column=7&margin-w=15&margin-h=15"
                  path: profile/trophy.svg
                  token: ${{ secrets.PROFILE_STATS_TOKEN }}

            - name: Commit trophy
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add profile/trophy.svg
                  git commit -m "Update GitHub trophies" || exit 0
                  git push
